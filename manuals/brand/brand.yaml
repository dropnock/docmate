# The one place for the manuals' branding. build.py (HTML + print/PDF) and
# tools/build_docx.py (Word) both read this file; nothing else hard-codes a
# colour, font or name. Change a value and rebuild to re-skin every manual.

product: DocMate
portal: Customer Portal

# Logo (path relative to this folder) for the manuals' header and PDF cover;
# logo_raster is the PNG copy Word gets. Leave logo empty to show the product
# name as a wordmark instead. Both are made from source/docmate-logo-source.svg
# by tools/make_logo_assets.py, which also writes the app's and the sign-in
# page's copies.
logo: logo.svg
logo_raster: logo.png

# Colours come from the logo and mirror frontend/src/shared/theme/theme.ts.
colors:
  primary: "#092B59"        # logo navy ("Doc"): headings, active TOC item
  primary_dark: "#061E40"
  primary_bg: "#E8EEF6"
  accent: "#078F82"         # logo teal ("Mate"): call-out bars, cover rule
  accent_bg: "#E6F4F2"      # call-out background, TOC hover
  link: "#06776C"           # teal darkened to pass WCAG AA as text on white
  link_hover: "#055C54"
  text: "#0F172A"
  text_secondary: "#64748B" # captions, footer, meta text
  border: "#E2E8F0"
  table_border: "#CBD5E1"
  background: "#F8FAFC"     # page background around the content
  surface: "#FFFFFF"

font:
  family: Inter
  # woff2 files in fonts/, by weight. Bundled so PDFs look the same on any server.
  files:
    400: fonts/inter-latin-400-normal.woff2
    600: fonts/inter-latin-600-normal.woff2
    700: fonts/inter-latin-700-normal.woff2
  fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"

# Footer text on every HTML page and PDF page.
footer: "DocMate Customer Portal"
copyright: "© DocMate"
# Shown at the foot of each HTML page; leave empty to omit.
support: "For help, contact your DocMate project manager."

# PDF page setup.
page:
  size: Letter
  margin: "0.75in"

# Word copies (tools/build_docx.py) use a font every Word install has, since
# a .docx can't carry the web font reliably.
docx_font: Calibri
